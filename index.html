/* ================= 解析試算表 ================= */
function parseSheet(values){
  const head = values[0].map(h => String(h||'').trim());
  const col = code => head.findIndex(h => h.startsWith(code + '. '));
  const gridCol = (code,row) => head.findIndex(h => h.startsWith(code + '. ') && h.endsWith('[' + row + ']'));
  const tsCol = head.findIndex(h => /時間戳記|Timestamp/i.test(h));
  const srcCol = head.findIndex(h => h.startsWith('來源'));
  const out = [];
  for (const row of values.slice(1)){
    if (!row || !row.length) continue;
    const r = {ts: tsCol>=0 ? row[tsCol] : '', src: srcCol>=0 ? String(row[srcCol]||'') : ''};
    for (const [code,q] of Object.entries(Q)){
      if (q.t==='grid'){
        r[code] = {};
        q.r.forEach(rowName => { const i = gridCol(code,rowName); if (i>=0 && row[i]!=='' && row[i]!=null) r[code][rowName] = String(row[i]); });
      } else {
        const i = col(code); const v = i>=0 ? row[i] : '';
        if (v==='' || v==null){ r[code] = q.t==='multi' ? [] : ''; continue; }
        if (q.t==='multi'){
          const s = String(v); const picked = q.o.filter(o => s.includes(o));
          let rest = s; picked.forEach(o => rest = rest.split(o).join(''));
          if (rest.replace(/[,\s、]/g,'').length) picked.push('其他');
          r[code] = picked;
        } else r[code] = String(v);
      }
    }
    out.push(r);
  }
  return out;
}
function segOf(r){
  if (r.S1==='目前是遠見訂戶') return r.S4==='自己付費' ? '自費訂戶' : '公司或贈閱訂戶';
  if (r.S1==='以前訂過，目前沒有訂閱') return '曾訂戶';
  if (r.S1==='遠見官網或線上讀會員，從未訂閱') return '會員';
  return r.S1 ? '其他讀者' : null;
}

/* ================= 模擬資料 ================= */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function makeDemo(n=620){
  const R = mulberry(20261125);
  const pick = (opts,w) => { const s=w.reduce((a,b)=>a+b,0); let x=R()*s; for(let i=0;i<opts.length;i++){x-=w[i]; if(x<=0) return opts[i];} return opts[opts.length-1]; };
  const multi = (opts,p,max) => { let a = opts.filter((o,i)=>R()<p[i]); if (!a.length) a=[pick(opts,p)]; if (max) a = a.sort(()=>R()-.5).slice(0,max); return a; };
  const grid = (q,fn) => { const g={}; q.r.forEach((row,i)=>g[row]=fn(i)); return g; };
  const rows = [];

  const c=diverging('推薦親友訂閱',cnt(subs,r=>r.C6,c6o),c6o,2,false);
  const parts=[a,b,c].filter(x=>x.html);
  const n=Math.max(0,...parts.map(x=>x.n));
  const ins = n>=MIN_N ? `<div class="insight"><b>重點：</b>用過的訂戶中，紙本滿意 ${fmt(a.pos||0)}、線上讀滿意 ${fmt(b.pos||0)}；${fmt(c.pos||0)} 會推薦親友訂閱。2023 對照值待補。</div>` : (n?`<div class="insight weak">目前只有 ${n} 份回答，樣本太少，先不下結論。</div>`:'');
  return `<h3>滿意度與推薦 <span class="tag">C3・C6 延續 2023</span></h3><div class="sub">中線左邊為負面、右邊為正面；右側數字＝正面比例（滿意度不含「沒有使用」）｜僅訂戶</div>${ins}${parts.map(x=>x.html).join('')||'<div class="empty">此篩選條件下沒有回答</div>'}<div class="legend"><span><i style="background:#B4542C"></i>很不滿意／一定不會</span><span><i style="background:#E2A383"></i>不太滿意／可能不會</span><span><i style="background:#8FB0DD"></i>還算滿意／可能會</span><span><i style="background:#0B2556"></i>很滿意／一定會</span></div>`;
}
function texts(rows, code){ const t=rows.map(r=>r[code]).filter(Boolean);
  return `<div class="card">${head(code,`${t.length} 則（最新在前）`)}${t.length?`<div class="quotes">${t.slice(-80).reverse().map(x=>`<p>${esc(x)}</p>`).join('')}</div>`:'<div class="empty">尚無回覆</div>'}</div>`; }

/* ================= 繪製 ================= */
function render(){
  const base=baseRows(), rows=SEG?segRows(base,SEG):base;
  const subs=rows.filter(r=>SUB_SEGS.includes(r.seg)), non=rows.filter(r=>NON_SEGS.includes(r.seg));
  $('fCount').textContent=`${rows.length} 份`;
  $('updated').textContent = LAST ? `更新於 ${LAST.toLocaleString('zh-TW',{hour12:false,month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}` : '';

  // KPI
  const kSub = s => { const r=segRows(base,s).filter(x=>x.C4); return r.length>=MIN_N?fmt(pct(r.filter(x=>x.C4==='一定會'||x.C4==='可能會').length,r.length)):'n<30'; };
  const c4=subs.filter(r=>r.C4), c6=subs.filter(r=>r.C6);
  const renew=pct(c4.filter(r=>r.C4==='一定會'||r.C4==='可能會').length,c4.length);
  const rec=pct(c6.filter(r=>r.C6==='一定會'||r.C6==='可能會').length,c6.length);
  const d1=rows.filter(r=>r.D1&&Object.keys(r.D1).length);
  const hot=pct(d1.filter(r=>Object.values(r.D1).includes('很有興趣')).length,d1.length);
  const topD1=Q.D1.r.map(row=>({row,p:pct(d1.filter(r=>r.D1[row]==='很有興趣').length,d1.length)})).sort((a,b)=>b.p-a.p)[0];
  const all=DATA.filter(r=>r.seg).length;
  $('kpis').innerHTML=`
   <div class="card"><div class="kl">回收份數${rows.length!==all?'（篩選後）':''}</div><div class="kv">${rows.length} <small>／目標 ${TARGET}</small></div><div class="prog"><i style="width:${Math.min(100,pct(all,TARGET))}%"></i></div><div class="ks">全部 ${all} 份，達成 ${fmt(pct(all,TARGET))}｜填答截止 12/10</div></div>
   <div class="card"><div class="kl">訂戶續訂意願（一定會＋可能會）</div><div class="kv">${c4.length?fmt(renew):'—'}</div><div class="ks">自費 <span class="up">${kSub('自費訂戶')}</span>　公司或贈閱 <span class="dn">${kSub('公司或贈閱訂戶')}</span></div></div>
   <div class="card"><div class="kl">訂戶推薦意願（一定會＋可能會）</div><div class="kv">${c6.length?fmt(rec):'—'}</div><div class="ks">延續 2023 題目｜2023 對照值：待補</div></div>
   <div class="card"><div class="kl">對任一合作產品「很有興趣」</div><div class="kv">${d1.length?fmt(hot):'—'}</div><div class="ks">${topD1&&d1.length?`最受歡迎：<b>${esc(topD1.row)}</b>（${fmt(topD1.p)}）`:'尚無回答'}</div></div>`;

  // 總覽
  $('oHeat').innerHTML=heatmap(base);
  $('oDaily').innerHTML=daily(rows);
  $('oSat').innerHTML=satCard(subs);

  // 合作需求
  $('pGrid').innerHTML = `<div class="card wide">${heatmap(base)}</div>` +
    cardGrid(rows,'D4',{val:(c,n)=>100-pct(c[0],n),valName:'有興趣比例',note:'色塊越深預算越高'}) +
    cardOpt(rows,'D3') + cardOpt(rows,'D2') + cardOpt(rows,'D5') + cardOpt(rows,'D6') + cardOpt(rows,'D7');

  // 訂戶經營
  const w1='（訂戶）';
  $('sGrid').innerHTML = cardOpt(subs,'C4',{who:w1,ordered:true}) + cardOpt(subs,'C6',{who:w1,ordered:true}) +
    cardOpt(subs,'C5',{who:w1}) + cardOpt(subs,'C1',{who:w1}) +
    cardGrid(subs,'C2',{who:w1,val:(c,n)=>pct(c[0],n),valName:'用過比例'}) +
    `<div class="card">${satCard(subs)}</div>` + cardOpt(subs,'C7',{who:w1,ordered:true}) +
    cardOpt(subs,'S4',{who:w1,ordered:true}) + cardOpt(subs,'S2',{who:w1,ordered:true}) + cardOpt(subs,'S3',{who:w1,ordered:true});

  // 非訂戶
  const w2='（曾訂戶＋會員）';
  $('nGrid').innerHTML = cardGrid(non,'E1',{who:w2,val:(c,n)=>pct(c[0],n),valName:'用過比例'}) +
    cardOpt(non,'E2',{who:w2}) + cardOpt(non,'E3',{who:w2}) + cardOpt(non,'E4',{who:w2,ordered:true});

  // 讀者輪廓
  $('rGrid').innerHTML = ['A1','A2','B1','B2','B4'].map(c=>cardOpt(rows,c)).join('') +
    ['B3','A3','F2','F5','F4','F3','F7','F8','F1'].map(c=>cardOpt(rows,c,{ordered:true})).join('');

  // 開放題與名單
  const g1=rows.filter(r=>r.G1==='願意').length, f6=rows.filter(r=>String(r.F6).startsWith('願意')).length;
  $('qGrid').innerHTML = `<div class="card wide"><h3>可跟進的名單人數</h3><div class="sub">只顯示人數；聯絡資料請到回覆試算表篩選</div><div class="leads"><div><b>${g1}</b>願意參加深度訪談（G1）</div><div><b>${f6}</b>願意推薦公司了解企業團體方案（F6）</div></div></div>` + texts(rows,'D8') + texts(rows,'G3');
}

/* ================= 資料載入 ================= */
function setData(rows, mode){
  DATA = rows.map(r=>({...r, seg:segOf(r)})); MODE=mode; LAST=new Date();
  fillSelect('fSrc','管道',[...new Set(DATA.map(srcName))]);
  $('status').textContent = mode==='live'?'● 即時資料':'● 模擬資料'; $('status').className='chip '+(mode==='live'?'live':'demo');
  $('notice').hidden = mode==='live';
  $('notice').innerHTML = '目前顯示的是<b>模擬資料</b>（620 筆），僅供確認版面。按右上角「登入 Google 載入即時資料」即可切換。';
  drawPills(); render();
}
let tokenClient=null;
function initAuth(){ if(!window.google||!google.accounts) return false;
  tokenClient=google.accounts.oauth2.initTokenClient({client_id:CONFIG.CLIENT_ID,scope:CONFIG.SCOPE,callback:resp=>{ if(resp.error){alert('登入失敗：'+resp.error);return;} TOKEN=resp.access_token; loadLive(); }}); return true; }
async function api(path){ const res=await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+CONFIG.SHEET_ID+path,{headers:{Authorization:'Bearer '+TOKEN}});
  if(!res.ok){ throw new Error(res.status+' '+(await res.text()).slice(0,300)); } return res.json(); }
async function loadLive(){
  try{ $('btnLogin').textContent='載入中…';
    const meta=await api('?fields=sheets.properties(title,gridProperties)'); const sheets=meta.sheets.map(s=>s.properties);
    const target=sheets.find(s=>/表單回應|Form[ _]?Responses/i.test(s.title))||sheets.sort((a,b)=>b.gridProperties.columnCount-a.gridProperties.columnCount)[0];
    const v=await api('/values/'+encodeURIComponent("'"+target.title+"'")+'?valueRenderOption=UNFORMATTED_VALUE&dateTimeRenderOption=FORMATTED_STRING');
    const values=v.values||[];
    setData(values.length>1?parseSheet(values):[],'live');
    if(values.length<2){ $('notice').hidden=false; $('notice').innerHTML=`已連上回覆試算表（工作表「${esc(target.title)}」），目前還沒有回覆。可按「切換模擬資料」先看版面。`; }
    $('btnRefresh').disabled=false;
  }catch(e){ console.error(e); alert('讀取失敗：'+e.message+'\n\n請確認：1) 登入的帳號是 OAuth 測試使用者；2) 該帳號有回覆試算表的檢視權限。'); }
  finally{ $('btnLogin').textContent='登入 Google 載入即時資料'; }
}
$('btnLogin').onclick=()=>{ if(location.protocol==='file:'){alert('請用網址開啟，直接開檔案無法登入 Google。');return;}
  if(!tokenClient&&!initAuth()){alert('Google 登入元件尚未載入，請稍候再試。');return;} tokenClient.requestAccessToken({prompt:TOKEN?'':'consent'}); };
$('btnRefresh').onclick=()=>TOKEN?loadLive():$('btnLogin').click();
$('btnDemo').onclick=()=>setData(makeDemo(),'demo');

/* ================= 匯出快照（不含開放題與聯絡資料） ================= */
$('btnSnap').onclick=()=>{
  const clone=$('report').cloneNode(true);
  clone.querySelectorAll('.no-snapshot').forEach(e=>e.remove());
  clone.querySelectorAll('section[data-tab]').forEach(s=>{ s.hidden=false; s.removeAttribute('hidden'); const t=TABS.find(x=>x[0]===s.dataset.tab); if(t){ const h=document.createElement('h2'); h.textContent=t[1]; h.style.cssText='color:#0B2556;font-size:18px;margin:28px 0 12px'; s.prepend(h);} });
  if(MODE==='live'){ const n=clone.querySelector('#notice'); if(n) n.remove(); }
  const f=[SEG?'身分：'+SEG:'',...['fAge','fRole','fSrc'].map(id=>$(id).value?$(id).selectedOptions[0].textContent:'')].filter(Boolean);
  const stamp=new Date();
  const html=`<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>讀者需求快照</title><style>${$('dash-style').textContent}</style></head><body>
<div class="top" style="padding-bottom:16px"><div class="brand"><div class="k">遠見行銷部｜讀者調查 2026</div><h1>讀者需求快照</h1></div><div class="ks" style="margin-top:6px">${MODE==='live'?'即時資料':'模擬資料'}｜匯出於 ${stamp.toLocaleString('zh-TW',{hour12:false})}｜篩選：${f.length?esc(f.join('、')):'全部'}</div></div>
<main>${clone.innerHTML}</main><footer>此為靜態快照，不含開放題與聯絡資料；重點文字依數據自動產生。</footer></body></html>`;
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));
  a.download=`讀者需求快照_${stamp.getFullYear()}${String(stamp.getMonth()+1).padStart(2,'0')}${String(stamp.getDate()).padStart(2,'0')}.html`; a.click();
};

drawPills();
setData(makeDemo(),'demo');
</script>
</body>
</html>
